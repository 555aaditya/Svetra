name: ci

on:
  pull_request:
  push:
    branches: [main, develop]
  # update-prs.yml starts it on a branch it updated: its own pushes don't start pull_request runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The tests that need Supabase's database image skip without it, so pull it (retried; a
      # failed pull only skips them).
      - run: for i in 1 2 3; do docker pull public.ecr.aws/supabase/postgres:17.11.0.018 && break; sleep 10; done
        continue-on-error: true
      - run: cargo test

  msrv:
    # The oldest Rust that Cargo.toml's rust-version promises; let chains need 1.88.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --all-targets

  postgres:
    # Compile the fixtures, apply the SQL to PostgreSQL 16 with a Supabase stand-in,
    # and check that constraints and row-level security behave as declared.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo build
      - run: scripts/pg-check.sh

  supabase:
    # The same access tests and breakages on a real local Supabase (its database image, roles and
    # default privileges), where a stand-in can differ: this is how the anon hole bug was found.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: cargo build
      - run: scripts/supabase-check.sh

  webhooks:
    # The generated Edge Functions, called over HTTP on a real local Supabase with its REST API and
    # Edge Runtime: signed and unsigned calls, a repeat delivery, and every wrong call's status.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: cargo build
      - run: scripts/webhook-check.sh

  site:
    # The website builds (types, then Vite) with the real compiler output it imports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site

