# The design of your app. Your agent edits it with you; `svetra validate` checks every change.
# yaml-language-server: $schema=https://raw.githubusercontent.com/555aaditya/Svetra/main/schema/svetra.schema.json
svetra: "0.1"
system: App

auth:
  sign_in: [email]

entities:
  Doc:
    fields:
      id:       { type: uuid, primary: true }
      author:   { type: user, required: true }
      reviewer: { type: user, required: true }
      title:    { type: text, required: true }
      status:   { type: text, required: true, default: draft }
    indexes:
      - [author]
      - [reviewer]

policies:
  author_sees_own:
    on: Doc
    allow: [select, delete]
    when: "author == auth.user and status == 'draft'"
  author_sees_submitted:
    on: Doc
    allow: [select]
    when: "author == auth.user"
  reviewer_sees_submitted:
    on: Doc
    allow: [select]
    when: "reviewer == auth.user and status != 'draft'"
