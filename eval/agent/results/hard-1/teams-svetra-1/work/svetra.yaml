svetra: "0.1"
system: App

auth:
  sign_in: [email]

roles:
  member: { description: "Belongs to a team", scope: Team }

entities:
  Team:
    fields:
      id:   { type: uuid, primary: true }
      name: { type: text, required: true }
  Task:
    fields:
      id:     { type: uuid, primary: true }
      team:   { type: ref, entity: Team, required: true }
      author: { type: user, required: true }
      title:  { type: text, required: true }
    indexes:
      - [team]
      - [author]

policies:
  members_see_team:
    on: Team
    allow: [select]
    when: "has_role('member', id)"
  members_see_tasks:
    on: Task
    allow: [select]
    when: "has_role('member', team)"
  members_add_own_tasks:
    on: Task
    allow: [insert]
    when: "has_role('member', team) and author == auth.user"
  authors_change_tasks:
    on: Task
    allow: [update, delete]
    when: "has_role('member', team) and author == auth.user"

holes:
  start_team:
    kind: function
    input: { team_name: text }
    output: Team.id
    writes: [Team]
    grants: [member]
    when: "auth.user != null"
  add_member:
    kind: function
    input: { team_id: Team.id, person: uuid }
    writes: [Team]
    grants: [member]
    when: "has_role('member', team_id)"
