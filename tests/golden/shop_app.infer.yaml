svetra: "0.1"
system: App   # rename

entities:
  OrderItems:
    # check: critical, rls_off: Anyone on the internet can read, add, change and delete every row of public.order_items: row-level security is off.
    # row-level security is off here, so the database has no access rule (see the check finding). No policy is invented; add one deliberately.
    private: true
    fields:
      id:         { type: int, primary: true }   # UNTRANSLATED identity (always): Svetra has no auto-increment, inserts must give a value
      order_id:   { type: ref, entity: Orders, required: true }
      product_id: { type: ref, entity: Products, required: true }
      qty:        { type: int, required: true }   # lossy: was smallint, compiles to bigint
    unique:
      - [order_id, product_id]
    # UNTRANSLATED check order_items_qty_check: CHECK (((qty > 0) AND (qty < LEAST(10, 100))))
    # UNTRANSLATED policy order_items_via_order: CREATE POLICY order_items_via_order ON public.order_items AS PERMISSIVE FOR ALL TO authenticated USING ((EXISTS ( SELECT 1 FROM orders o WHERE ((o.id = order_items.order_id) AND (o.customer = auth.uid()))))) -- row-level security is off, so the policy isn't enforced
  Orders:
    # policies: 5 of 6 translated. The draft is NARROWER than the database: whatever an UNTRANSLATED policy below lets in, this draft keeps out, until you port it.
    fields:
      id:         { type: uuid, primary: true }
      customer:   { type: user, required: true }   # lossy: the foreign key had ON DELETE CASCADE, a user field has none
      status:     { type: enum, values: [open, paid, shipped], required: true, default: open }   # lossy: was enum type order_status, compiles to text with a check
      placed_on:  { type: date, auto: now }
      note:       { type: text, default: none }
      created_at: { type: timestamp, auto: now }   # lossy: was timestamp without time zone, compiles to timestamptz
      shipped:    { type: bool, required: true, default: false }
    constraints:
      orders_check: "(status != 'shipped') or shipped"
    indexes:
      - [customer]
    # UNTRANSLATED index orders_note_idx: CREATE INDEX orders_note_idx ON public.orders USING btree (lower(note))
    # UNTRANSLATED policy orders_staff_read: CREATE POLICY orders_staff_read ON public.orders AS PERMISSIVE FOR SELECT TO authenticated USING (((auth.jwt() ->> 'role'::text) = 'staff'::text)) -- reads a JWT claim (auth.jwt())
  Products:
    # check: warning, open_read: Anyone on the internet can read every row of public.products (policy products_read). Fine for public data; a leak otherwise.
    fields:
      id:     { type: uuid, primary: true }
      sku:    { type: text, required: true, unique: true }
      name:   { type: text, required: true }
      price:  { type: money, precision: 12, scale: 2, required: true }
      weight: { type: float }   # lossy: was real, compiles to double precision
      stock:  { type: int, required: true, default: 0 }   # lossy: was integer, compiles to bigint
      # UNTRANSLATED column rating numeric: numeric without precision and scale
      # UNTRANSLATED column tags text[]: type text[]
      meta:   { type: json }
    constraints:
      products_price_check: "price >= 0"
      stock_non_negative: "stock >= 0"
    # UNTRANSLATED check stock_text: CHECK (((stock)::text <> '-1'::text))
    # UNTRANSLATED index products_tags_idx: CREATE INDEX products_tags_idx ON public.products USING gin (tags)
  Profiles:
    fields:
      id:           { type: user, primary: true }
      display_name: { type: text, required: true }
      bio:          { type: text }   # lossy: was character varying(280), the length limit is dropped
      created_at:   { type: timestamp, required: true, auto: now }
  Reviews:
    # policies: 4 of 5 translated. The draft is NARROWER than the database: whatever an UNTRANSLATED policy below lets in, this draft keeps out, until you port it.
    fields:
      id:         { type: uuid, primary: true }
      product_id: { type: ref, entity: Products, on_delete: cascade, required: true }
      author:     { type: user, required: true }   # lossy: was a foreign key to public.profiles (id), now one to auth.users: it accepts a person with no row in profiles; the foreign key had ON DELETE CASCADE, a user field has none
      parent_id:  { type: ref, entity: Reviews, on_delete: set_null }
      body:       { type: text, required: true }
    # UNTRANSLATED policy reviews_delete_moderator: CREATE POLICY reviews_delete_moderator ON public.reviews AS PERMISSIVE FOR DELETE TO authenticated USING ((EXISTS ( SELECT 1 FROM profiles p WHERE ((p.id = auth.uid()) AND (p.display_name = 'moderator'::text))))) -- a subquery

policies:
  orders_delete_guard:
    on: Orders
    as: authenticated
    allow: [delete]
    restrictive: true
    when: "customer == auth.user"
  orders_delete_own:
    on: Orders
    as: authenticated
    allow: [delete]
    when: "customer == auth.user"
  orders_insert_own:
    on: Orders
    as: authenticated
    allow: [insert]
    when: "customer == auth.user"
  orders_select_own:
    on: Orders
    as: authenticated
    allow: [select]
    when: "customer == auth.user"
  orders_update_own:
    on: Orders
    as: authenticated
    allow: [update]
    when: "customer == auth.user"
  products_read:
    on: Products
    as: anyone
    allow: [select]
    when: "true"
  profiles_insert_own:
    on: Profiles
    as: authenticated
    allow: [insert]
    when: "id == auth.user"
  profiles_own:
    on: Profiles
    as: authenticated
    allow: [select]
    when: "id == auth.user"
  reviews_delete_own:
    on: Reviews
    as: authenticated
    allow: [delete]
    when: "author == auth.user"
  reviews_insert_own:
    on: Reviews
    as: authenticated
    allow: [insert]
    when: "author == auth.user"
  reviews_read:
    on: Reviews
    as: authenticated
    allow: [select]
    when: "true"
  reviews_update_own:
    on: Reviews
    as: authenticated
    allow: [update]
    when: "author == auth.user"

